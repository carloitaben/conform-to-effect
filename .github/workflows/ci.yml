name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: Test (effect@${{ matrix.effect-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        effect-version:
          - "4.0.0-beta.102"
          - beta
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm add -D "effect@${{ matrix.effect-version }}"
      - run: pnpm check
      - run: pnpm test
